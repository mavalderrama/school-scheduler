# Postgres desechable para `make test`. Misma imagen que producción, datos en tmpfs,
# solo accesible desde localhost. Levantar con `make test-db-up`, tirar con `make test-db-down`.
services:
  postgres-test:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: agenda
      POSTGRES_DB: agenda
    ports:
      - "127.0.0.1:5533:5432"
    tmpfs:
      - /var/lib/postgresql
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda -d agenda"]
      interval: 2s
      timeout: 3s
      retries: 15
