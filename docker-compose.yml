services:
  postgres:
    # PostgreSQL 18 con la extensión pgvector. Desde la imagen 18 el volumen va en
    # /var/lib/postgresql (no en /var/lib/postgresql/data).
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenda}
      POSTGRES_DB: ${POSTGRES_DB:-agenda}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agenda} -d ${POSTGRES_DB:-agenda}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  bot:
    build:
      context: .
      target: ${BOT_IMAGE_TARGET:-with-claude}
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    # El único puerto publicado es el admin de Django, y solo en la LAN (ADMIN_BIND).
    # Nunca hacer port-forward de este puerto hacia internet.
    ports:
      - "${ADMIN_BIND:-0.0.0.0}:${ADMIN_PORT:-8000}:${ADMIN_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
    # Migra y arranca (bot + scheduler + admin en un solo proceso).
    command: sh -c "python manage.py migrate --noinput && python -m app.main"
    restart: unless-stopped

volumes:
  pgdata:
