[project]
name = "agenda-escolar-bot"
version = "0.1.0"
description = "Bot de Telegram que lee fotos de la agenda escolar y avisa lo de mañana."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.31,<4",
    "django>=6.1,<6.2",
    "psycopg[binary,pool]>=3.2.8,<4",
    "pgvector>=0.5,<0.6",
    "uvicorn>=0.52,<1",
    "django-stubs-ext>=6.1",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "structlog>=26.1",
    "apscheduler>=3.11,<4",
    "anthropic>=1.3,<2",
    "openai>=3.7,<4",
]

[project.optional-dependencies]
# Solo se instala en el target `with-claude` del Dockerfile.
claude = ["claude-agent-sdk>=0.2.151"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-django>=4.14",
    "ruff>=0.16",
    "mypy>=2.3",
    "django-stubs>=6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # tildes y ñ en comentarios/docstrings en español

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/*" = ["E501", "RUF012"]  # generadas por makemigrations
"app/db/admin.py" = ["RUF012"]   # list_display & co. son atributos de clase por diseño
"app/db/models.py" = ["RUF012"]  # Meta.constraints / Meta.indexes

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "claude_agent_sdk.*", "pgvector.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "app.django_settings"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.django_settings_test"
